name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: beyond_marks_test
          POSTGRES_USER: test_runner
          POSTGRES_PASSWORD: local_ci_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_runner -d beyond_marks_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://test_runner:local_ci_test_only@localhost:5432/beyond_marks_test
      TEST_DATABASE_URL: postgresql://test_runner:local_ci_test_only@localhost:5432/beyond_marks_test
      JWT_SECRET: isolated-ci-test-secret-not-for-deployment-2026
      APP_DATABASE_SCHEMA: public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - run: python -m pip install -r backend/requirements.lock.txt
      - run: python -m pytest -q
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
